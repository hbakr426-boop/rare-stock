<html lang="en">

            font-family: 'Inter', sans-serif;
            overflow-x: hidden;

            justify-content: space-between;

            backdrop-filter: blur(10px);

            text-transform: uppercase;

        .hero h1 {

            text-transform: uppercase;

        .product-grid {
            display: grid;

            gap: 30px;
        }
        .product-card {

            border: 1px solid #222;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            border-color: #444;
        }
        .image-container {
            background: #1e1e1e;

            overflow: hidden;
        }

            width: 100%;
            height: 100%;
            object-fit: cover;
        }

            font-weight: 800;
            padding: 5px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }
