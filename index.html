<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RARE STOCK // Luxury Football Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #050505;
            --bg-card: #0f0a0a;
            --bg-elevated: #1a0f0f;
            --accent-red: #ff1e38;
            --accent-glow: rgba(255, 30, 56, 0.25);
            --text-main: #ffffff;
            --text-muted: #999999;
            --border-color: #261214;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 30, 56, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(120, 0, 15, 0.06) 0%, transparent 40%);
            min-height: 100vh;
        }

        /* Header & Navigation */
        header {
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.85);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .logo span {
            background: linear-gradient(135deg, #ff1e38, #ff6b7b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cart-btn {
            background: linear-gradient(135deg, #1a0f0f, #2b1114);
            border: 1px solid rgba(255, 30, 56, 0.3);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 30, 56, 0.1);
        }

        .cart-btn:hover {
            border-color: var(--accent-red);
            box-shadow: 0 4px 25px var(--accent-glow);
            transform: translateY(-1px);
        }

        .cart-count {
            background: var(--accent-red);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 900;
            box-shadow: 0 0 10px var(--accent-red);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 80px 20px 50px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            text-transform: uppercase;
            margin-bottom: 15px;
            background: linear-gradient(180deg, #ffffff 30%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* Products Grid */
        .products-section {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 20px 100px 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 30, 56, 0.4);
            box-shadow: 0 10px 30px rgba(255, 30, 56, 0.12);
        }

        .image-container {
            background: var(--bg-elevated);
            height: 340px;
            position: relative;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .product-card:hover .image-container img {
            transform: scale(1.06);
        }

        .badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 30, 56, 0.2);
            color: #ff6b7b;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }

        .product-info {
            padding: 22px;
        }

        .category {
            color: var(--accent-red);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .product-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 16px;
            height: 40px;
            line-height: 1.3;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #cccccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .view-details-link {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .product-card:hover .view-details-link {
            color: var(--accent-red);
        }

        /* Slide-out Cart Drawer */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: flex-end;
        }

        .cart-drawer {
            background: var(--bg-card);
            border-left: 1px solid var(--border-color);
            width: 100%;
            max-width: 440px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 30px;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cart-overlay.active .cart-drawer {
            transform: translateX(0);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .cart-header h2 {
            font-size: 1.25rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .close-drawer {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-drawer:hover {
            color: var(--accent-red);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .cart-item {
            background: var(--bg-elevated);
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-info h4 {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .cart-item-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .cart-item-right {
            text-align: right;
        }

        .cart-item-price {
            font-weight: 800;
            font-size: 1rem;
            margin-bottom: 8px;
            color: var(--accent-red);
        }

        .remove-item {
            background: none;
            border: none;
            color: #ff5c5c;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
        }

        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .checkout-trigger-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-red), #cc1226);
            color: #fff;
            border: none;
            padding: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(255, 30, 56, 0.3);
        }

        .checkout-trigger-btn:hover {
            opacity: 0.95;
            box-shadow: 0 6px 25px rgba(255, 30, 56, 0.5);
            transform: translateY(-1px);
        }

        /* Modals */
        .modal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid rgba(255, 30, 56, 0.2);
            width: 100%;
            max-width: 550px;
            border-radius: 18px;
            padding: 35px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: border-color 0.2s;
        }

        .modal-close:hover {
            border-color: var(--accent-red);
        }

        /* Product Detail Layout */
        .detail-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .detail-img {
            width: 100%;
            height: 320px;
            border-radius: 12px;
            object-fit: cover;
            background: var(--bg-elevated);
        }

        .detail-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .detail-price {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--accent-red);
        }

        .detail-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .size-selector {
            display: flex;
            gap: 12px;
            margin-top: 5px;
        }

        .size-btn {
            flex: 1;
            padding: 14px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .size-btn.selected {
            border-color: var(--accent-red);
            background: rgba(255, 30, 56, 0.12);
            box-shadow: 0 0 15px rgba(255, 30, 56, 0.2);
        }

        .add-to-cart-action {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-red), #cc1226);
            color: #fff;
            border: none;
            padding: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 20px rgba(255, 30, 56, 0.3);
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 10px rgba(255, 30, 56, 0.2);
        }

        .submit-order-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-red), #cc1226);
            color: #fff;
            border: none;
            padding: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 20px rgba(255, 30, 56, 0.3);
            transition: opacity 0.2s;
        }

        .submit-order-btn:hover {
            opacity: 0.95;
        }

        .empty-cart-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-size: 0.9rem;
        }

        /* Success Screen */
        .success-box {
            text-align: center;
            padding: 20px;
        }

        .success-icon {
            font-size: 3.5rem;
            color: var(--accent-red);
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 30, 56, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Rare <span>Stock</span></div>
        <button class="cart-btn" onclick="toggleCart(true)">
            Cart <div class="cart-count" id="cartBadge">0</div>
        </button>
    </header>

    <section class="hero">
        <h1>Exclusive Football Archive</h1>
        <p>Curated rare pieces & legendary drops. Delivered securely across Egypt.</p>
    </section>

    <main class="products-section">
        <div class="product-grid" id="productGrid">
            <!-- Populated by JS -->
        </div>
    </main>

    <!-- Slide-out Cart Drawer -->
    <div class="cart-overlay" id="cartOverlay" onclick="handleOverlayClick(event)">
        <div class="cart-drawer">
            <div class="cart-header">
                <h2>Your Cart</h2>
                <button class="close-drawer" onclick="toggleCart(false)">&times;</button>
            </div>
            <div class="cart-items" id="cartItemsList">
                <div class="empty-cart-msg">Your cart is empty</div>
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cartTotalPrice" style="color: var(--accent-red);">0 EGP</span>
                </div>
                <button class="checkout-trigger-btn" onclick="openCheckoutScreen()">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div class="modal-container" id="productModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeProductModal()">&times;</button>
            <div class="detail-content" id="productDetailContent">
                <!-- Dynamically filled -->
            </div>
        </div>
    </div>

    <!-- Detailed Checkout Form Screen -->
    <div class="modal-container" id="checkoutModal">
        <div class="modal-box" style="max-width: 600px;">
            <button class="modal-close" onclick="closeCheckoutScreen()">&times;</button>
            <div id="checkoutFormContent">
                <h3 style="font-size: 1.35rem; font-weight: 800; text-transform: uppercase; margin-bottom: 6px;">Secure Checkout</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px;">Enter your delivery details for your order.</p>
                
                <form id="detailedCheckoutForm" onsubmit="submitFinalOrder(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="chkName" required placeholder="e.g. Omar Mohamed">
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="chkPhone" required placeholder="010XXXXXXXX">
                        </div>
                        <div class="form-group full">
                            <label>Email Address</label>
                            <input type="email" id="chkEmail" required placeholder="e.g. omar@gmail.com">
                        </div>
                        <div class="form-group">
                            <label>City / Governorate</label>
                            <input type="text" id="chkCity" required placeholder="e.g. Cairo, Giza">
                        </div>
                        <div class="form-group">
                            <label>Street Name</label>
                            <input type="text" id="chkStreet" required placeholder="e.g. Road 9 / Mossad St.">
                        </div>
                        <div class="form-group">
                            <label>House / Building Number</label>
                            <input type="text" id="chkHouse" required placeholder="e.g. Bldg 14, Apt 3">
                        </div>
                        <div class="form-group">
                            <label>Nearest Landmark (Optional)</label>
                            <input type="text" id="chkLandmark" placeholder="e.g. Behind Metro Market">
                        </div>
                    </div>
                    <button type="submit" class="submit-order-btn">Place Order</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, title: "Argentina Home (Messi #10)", category: "National / Legend", price: 550, badge: "Archive #01", image: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=700&q=80", desc: "The iconic striped masterpiece engineered for peak comfort and timeless aesthetic appeal." },
            { id: 2, title: "Al Ahly Special Checkered (Haier)", category: "Egyptian Giants", price: 550, badge: "Archive #02", image: "https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=700&q=80", desc: "Red eagles edition featuring the modern checkered pattern and premium red-black details." },
            { id: 3, title: "Zamalek Special Dark Grey/Red", category: "Egyptian Giants", price: 550, badge: "Archive #03", image: "https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=700&q=80", desc: "Sleek slate dark tones paired with smoldering crimson red accents for ultimate off-pitch styling." },
            { id: 4, title: "Egypt National Kit (Salah #10)", category: "National Team", price: 550, badge: "Archive #04", image: "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=700&q=80", desc: "Pharaohs home strip with intricate patterns and supreme dry-fit finish." },
            { id: 5, title: "Juventus Retro (Zidane #21 / Sony)", category: "Legends & Retros", price: 599, badge: "Archive #05", image: "https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?auto=format&fit=crop&w=700&q=80", desc: "Legendary 90s nostalgia with original vintage Sony sponsor badge and classic collar." },
            { id: 6, title: "Brazil Black & Red (Ronaldo #9)", category: "Legends & Retros", price: 599, badge: "Archive #06", image: "https://images.unsplash.com/photo-1543326727-cf6c39e8f84c?auto=format&fit=crop&w=700&q=80", desc: "Streetwear hybrid black edition honoring O Fenômeno in absolute luxury." },
            { id: 7, title: "Maradona Argentina Away #10", category: "Legends & Retros", price: 599, badge: "Archive #07", image: "https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=700&q=80", desc: "A timeless dark blue masterpiece capturing the immortal spirit of Diego." },
            { id: 8, title: "FC Barcelona x Kobe Edition", category: "Modern Hype", price: 550, badge: "Archive #08", image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=700&q=80", desc: "Mamba mentality meets Camp Nou heritage in this limited crossover release." },
            { id: 9, title: "Man United Black Retro (Ronaldo #7)", category: "Legends & Retros", price: 550, badge: "Archive #09", image: "https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=700&q=80", desc: "The iconic early 2000s black kit with crimson trim. Pure terrace culture." },
            { id: 10, title: "Spain Vintage Off-White/Red", category: "Modern Hype", price: 550, badge: "Archive #10", image: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=700&q=80", desc: "Clean off-white minimalist palette crafted for high-end fashion integration." }
        ];

        let cart = [];
        let selectedSize = "Medium (M)";
        let activeProduct = null;

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => `
                <div class="product-card" onclick="openProductModal(${p.id})">
                    <div class="image-container">
                        <span class="badge">${p.badge}</span>
                        <img src="${p.image}" alt="${p.title}" loading="lazy">
                    </div>
                    <div class="product-info">
                        <div class="category">${p.category}</div>
                        <h3 class="product-title">${p.title}</h3>
                        <div class="product-footer">
                            <span class="price">${p.price} EGP</span>
                            <span class="view-details-link">View Piece &rarr;</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openProductModal(id) {
            activeProduct = products.find(p => p.id === id);
            selectedSize = "Medium (M)";
            
            const content = document.getElementById('productDetailContent');
            content.innerHTML = `
                <img src="${activeProduct.image}" alt="${activeProduct.title}" class="detail-img">
                <div style="font-size: 0.75rem; color: var(--accent-red); text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">${activeProduct.category}</div>
                <h2 class="detail-title">${activeProduct.title}</h2>
                <div class="detail-price">${activeProduct.price} EGP</div>
                <p class="detail-desc">${activeProduct.desc}</p>
                
                <div style="margin-top: 10px;">
                    <label style="display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;">Select Size:</label>
                    <div class="size-selector">
                        <div class="size-btn selected" id="sizeM" onclick="selectSize('Medium (M)')">Medium (M)</div>
                        <div class="size-btn" id="sizeL" onclick="selectSize('Large (L)')">Large (L)</div>
                    </div>
                </div>

                <button class="add-to-cart-action" onclick="addToCart()">Add to Cart</button>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeProductModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function selectSize(size) {
            selectedSize = size;
            if(size === 'Medium (M)') {
                document.getElementById('sizeM').classList.add('selected');
                document.getElementById('sizeL').classList.remove('selected');
            } else {
                document.getElementById('sizeL').classList.add('selected');
                document.getElementById('sizeM').classList.remove('selected');
            }
        }

        function addToCart() {
            const cartItem = {
                id: activeProduct.id + '-' + selectedSize,
                title: activeProduct.title,
                price: activeProduct.price,
                size: selectedSize
            };
            
            cart.push(cartItem);
            updateCartUI();
            closeProductModal();
            toggleCart(true);
        }

        function removeFromCart(uniqueId) {
            cart = cart.filter(item => item.id !== uniqueId);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartBadge').innerText = cart.length;
            const list = document.getElementById('cartItemsList');
            
            if(cart.length === 0) {
                list.innerHTML = `<div class="empty-cart-msg">Your cart is empty</div>`;
                document.getElementById('cartTotalPrice').innerText = `0 EGP`;
                return;
            }

            let total = 0;
            list.innerHTML = cart.map(item => {
                total += item.price;
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.title}</h4>
                            <p>Size: ${item.size}</p>
                        </div>
                        <div class="cart-item-right">
                            <div class="cart-item-price">${item.price} EGP</div>
                            <button class="remove-item" onclick="removeFromCart('${item.id}')">Remove</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('cartTotalPrice').innerText = total + ` EGP`;
        }

        function toggleCart(open) {
            const overlay = document.getElementById('cartOverlay');
            if(open) {
                overlay.style.display = 'flex';
                setTimeout(() => overlay.classList.add('active'), 10);
            } else {
                overlay.classList.remove('active');
                setTimeout(() => overlay.style.display = 'none', 300);
            }
        }

        function handleOverlayClick(e) {
            if(e.target === document.getElementById('cartOverlay')) {
                toggleCart(false);
            }
        }

        function openCheckoutScreen() {
            if(cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            toggleCart(false);
            document.getElementById('checkoutFormContent').innerHTML = `
                <h3 style="font-size: 1.35rem; font-weight: 800; text-transform: uppercase; margin-bottom: 6px;">Secure Checkout</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px;">Enter your delivery details for your order.</p>
                
                <form id="detailedCheckoutForm" onsubmit="submitFinalOrder(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="chkName" required placeholder="e.g. Omar Mohamed">
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="chkPhone" required placeholder="010XXXXXXXX">
                        </div>
                        <div class="form-group full">
                            <label>Email Address</label>
                            <input type="email" id="chkEmail" required placeholder="e.g. omar@gmail.com">
                        </div>
                        <div class="form-group">
                            <label>City / Governorate</label>
                            <input type="text" id="chkCity" required placeholder="e.g. Cairo, Giza">
                        </div>
                        <div class="form-group">
                            <label>Street Name</label>
                            <input type="text" id="chkStreet" required placeholder="e.g. Road 9 / Mossad St.">
                        </div>
                        <div class="form-group">
                            <label>House / Building Number</label>
                            <input type="text" id="chkHouse" required placeholder="e.g. Bldg 14, Apt 3">
                        </div>
                        <div class="form-group">
                            <label>Nearest Landmark (Optional)</label>
                            <input type="text" id="chkLandmark" placeholder="e.g. Behind Metro Market">
                        </div>
                    </div>
                    <button type="submit" class="submit-order-btn">Place Order</button>
                </form>
            `;
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeCheckoutScreen() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        function submitFinalOrder(e) {
            e.preventDefault();
            
            const orderData = {
                items: cart,
                total: cart.reduce((sum, i) => sum + i.price, 0),
                customer: {
                    name: document.getElementById('chkName').value,
                    phone: document.getElementById('chkPhone').value,
                    email: document.getElementById('chkEmail').value,
                    city: document.getElementById('chkCity').value,
                    street: document.getElementById('chkStreet').value,
                    house: document.getElementById('chkHouse').value,
                    landmark: document.getElementById('chkLandmark').value
                },
                timestamp: new Date().toISOString()
            };

            // --- AUTOMATED BACKEND / BOT HOOK ---
            // fetch('https://your-webhook-url-here', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify(orderData)
            // }).catch(err => console.log('Background sync error:', err));

            console.log("Order captured for database/spreadsheet:", orderData);

            cart = [];
            updateCartUI();

            document.getElementById('checkoutFormContent').innerHTML = `
                <div class="success-box">
                    <div class="success-icon">&#10003;</div>
                    <h3 style="font-size: 1.4rem; font-weight: 800; text-transform: uppercase; margin-bottom: 10px;">Order Confirmed</h3>
                    <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 25px;">
                        Thank you! Your order has been successfully placed and recorded. We will contact you shortly to coordinate your delivery.
                    </p>
                    <button class="submit-order-btn" onclick="closeCheckoutScreen()">Back to Store</button>
                </div>
            `;
        }

        renderProducts();
    </script>
</body>
</html>
